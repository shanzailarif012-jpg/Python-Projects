<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Fast Ticket Booker{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">Fast Ticket Booker</a>
    <nav>
      <a href="{{ url_for('index') }}">Book ticket</a>
      <a href="{{ url_for('history') }}">Booking history</a>
    </nav>
  </header>

  <main class="page">
    {% with messages = get_flashed_messages() %}
      {% for m in messages %}<p class="notice">{{ m }}</p>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <footer class="foot">Developed by Dev_Shanzail</footer>
</body>
</html>
